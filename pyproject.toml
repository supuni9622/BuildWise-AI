[project]
name = "buildwise-ai"
version = "0.1.0"
description = "CrewAI-powered product consulting board that transforms vague ideas into build-ready product blueprints."
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # ==========================================================================
    # CrewAI
    # ==========================================================================

    "crewai[openai,anthropic,litellm,tools]==1.15.5",

    # ==========================================================================
    # API
    # ==========================================================================

    "fastapi>=0.116.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "python-multipart>=0.0.20,<1.0.0",

    # ==========================================================================
    # Configuration
    # ==========================================================================

    "python-dotenv>=1.1.0,<2.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",

    # ==========================================================================
    # HTTP
    # ==========================================================================

    "httpx>=0.28.1,<1.0.0",
    "tenacity>=9.1.0,<10.0.0",

    # ==========================================================================
    # Database
    # ==========================================================================

    "sqlalchemy>=2.0.41,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "greenlet>=3.2.3,<4.0.0",

    # Object storage
    "boto3>=1.40.0,<2.0.0",

    # ==========================================================================
    # Logging / Serialization
    # ==========================================================================

    "structlog>=25.4.0,<26.0.0",
    "orjson>=3.11.0,<4.0.0",
]

[dependency-groups]
dev = [
    # ==========================================================================
    # Testing
    # ==========================================================================

    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-cov>=6.2.0,<7.0.0",

    # ==========================================================================
    # Static Analysis
    # ==========================================================================

    "ruff>=0.12.0,<1.0.0",
    "mypy>=1.16.0,<2.0.0",

    # ==========================================================================
    # Type Stubs
    # ==========================================================================

    "types-python-dateutil>=2.9.0.20250708",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildwise"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

plugins = [
    "pydantic.mypy",
]

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

addopts = """
-ra
--strict-markers
--strict-config
"""

asyncio_mode = "auto"

markers = [
    "unit",
    "integration",
    "slow",
]
