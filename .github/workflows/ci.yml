name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "false"
      ENVIRONMENT: test
      APP_ENV: test
      CREWAI_TRACING_ENABLED: "false"
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Tests and coverage
        run: uv run pytest --cov=buildwise --cov-report=term-missing --cov-fail-under=70
      - name: Application startup smoke test
        run: |
          uv run uvicorn buildwise.main:app --host 127.0.0.1 --port 8080 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          exit 1

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: buildwise-ai:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run --detach --name buildwise-ci -p 8080:8000 \
            -e APP_ENV=test -e CREWAI_TRACING_ENABLED=false buildwise-ai:ci
          trap 'docker logs buildwise-ci; docker rm --force buildwise-ci' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          exit 1
