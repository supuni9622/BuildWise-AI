name: buildwise-ai

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: buildwise-api

    restart: unless-stopped

    environment:
      # =======================================================================
      # Application
      # =======================================================================

      APP_NAME: ${APP_NAME:-BuildWise AI}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: docker

      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      HOST: 0.0.0.0
      PORT: 8000
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}

      # =======================================================================
      # Database
      # =======================================================================

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-buildwise}:${POSTGRES_PASSWORD:-buildwise}@postgres:5432/${POSTGRES_DB:-buildwise}

      # =======================================================================
      # Blueprint report storage
      # =======================================================================

      REPORT_STORAGE_BACKEND: ${REPORT_STORAGE_BACKEND:-filesystem}
      REPORT_STORAGE_PATH: ${REPORT_STORAGE_PATH:-data/reports}
      STORE_BLUEPRINT_JSON: ${STORE_BLUEPRINT_JSON:-false}
      S3_REPORT_BUCKET: ${S3_REPORT_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}

      # =======================================================================
      # Provider credentials
      # =======================================================================

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # =======================================================================
      # Active BuildWise workflow models
      # =======================================================================

      FAST_MODEL: ${FAST_MODEL:-openai/gpt-5-mini}

      PRIMARY_AGENT_MODEL: ${PRIMARY_AGENT_MODEL:-openai/gpt-5-mini}

      ARCHITECT_MODEL: ${ARCHITECT_MODEL:-openai/gpt-5.2}

      LEAD_REVIEWER_MODEL: ${LEAD_REVIEWER_MODEL:-openai/gpt-5.2}

      # =======================================================================
      # OpenAI compatibility fallback models
      #
      # These values are configuration only. The Python runtime must explicitly
      # implement fallback selection, validation, logging, and usage tracking.
      # =======================================================================

      FALLBACK_FAST_MODEL: ${FALLBACK_FAST_MODEL:-openai/gpt-4.1-nano}

      FALLBACK_PRIMARY_MODEL: ${FALLBACK_PRIMARY_MODEL:-openai/gpt-4.1-mini}

      FALLBACK_ARCHITECT_MODEL: ${FALLBACK_ARCHITECT_MODEL:-openai/gpt-4.1}

      FALLBACK_LEAD_REVIEWER_MODEL: ${FALLBACK_LEAD_REVIEWER_MODEL:-openai/gpt-4.1}

      MODEL_FALLBACK_ENABLED: ${MODEL_FALLBACK_ENABLED:-false}

      MODEL_FALLBACK_MAX_ATTEMPTS: ${MODEL_FALLBACK_MAX_ATTEMPTS:-1}

      MODEL_FALLBACK_ON_TIMEOUT: ${MODEL_FALLBACK_ON_TIMEOUT:-true}

      MODEL_FALLBACK_ON_RATE_LIMIT: ${MODEL_FALLBACK_ON_RATE_LIMIT:-false}

      MODEL_FALLBACK_ON_MODEL_UNAVAILABLE: ${MODEL_FALLBACK_ON_MODEL_UNAVAILABLE:-true}

      # =======================================================================
      # Anthropic evaluation models
      # =======================================================================

      EVALUATION_MODEL: ${EVALUATION_MODEL:-anthropic/claude-sonnet-5}

      STRONG_EVALUATION_MODEL: ${STRONG_EVALUATION_MODEL:-anthropic/claude-opus-4-8}

      CLAUDE_FAST_MODEL: ${CLAUDE_FAST_MODEL:-anthropic/claude-haiku-4-5}

      CLAUDE_PRIMARY_MODEL: ${CLAUDE_PRIMARY_MODEL:-anthropic/claude-sonnet-5}

      CLAUDE_ARCHITECT_MODEL: ${CLAUDE_ARCHITECT_MODEL:-anthropic/claude-sonnet-5}

      CLAUDE_LEAD_REVIEWER_MODEL: ${CLAUDE_LEAD_REVIEWER_MODEL:-anthropic/claude-opus-4-8}

      # =======================================================================
      # Evaluation behavior
      # =======================================================================

      EVALUATION_ENABLED: ${EVALUATION_ENABLED:-false}

      CROSS_PROVIDER_EVALUATION_ENABLED: ${CROSS_PROVIDER_EVALUATION_ENABLED:-false}

      EVALUATION_SAMPLE_RATE: ${EVALUATION_SAMPLE_RATE:-0.0}

      STORE_EVALUATION_OUTPUTS: ${STORE_EVALUATION_OUTPUTS:-true}

      EVALUATION_BEST_EFFORT: ${EVALUATION_BEST_EFFORT:-true}

      EVALUATION_ASYNC: ${EVALUATION_ASYNC:-true}

      # =======================================================================
      # CrewAI
      # =======================================================================

      CREWAI_TRACING_ENABLED: ${CREWAI_TRACING_ENABLED:-true}

      CREWAI_VERBOSE: ${CREWAI_VERBOSE:-true}

      # =======================================================================
      # LLM runtime controls
      # =======================================================================

      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}

      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}

      MAX_AGENT_ITERATIONS: ${MAX_AGENT_ITERATIONS:-4}

      MAX_EXECUTION_SECONDS: ${MAX_EXECUTION_SECONDS:-900}

      # =======================================================================
      # Usage and cost controls
      # =======================================================================

      MAX_SESSION_TOKENS: ${MAX_SESSION_TOKENS:-120000}

      MAX_ESTIMATED_COST_USD: ${MAX_ESTIMATED_COST_USD:-10.00}

      MAX_AGENT_EXECUTIONS: ${MAX_AGENT_EXECUTIONS:-20}

      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-30}

      MAX_RETRIES_PER_OPERATION: ${MAX_RETRIES_PER_OPERATION:-1}

      API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-30}

      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}

      MAX_ACTIVE_CONSULTATIONS: ${MAX_ACTIVE_CONSULTATIONS:-10}

      # =======================================================================
      # Logging and observability
      # =======================================================================

      ENABLE_STRUCTURED_LOGGING: ${ENABLE_STRUCTURED_LOGGING:-true}

      LOG_REQUEST_BODIES: ${LOG_REQUEST_BODIES:-false}

      LOG_LLM_PROMPTS: ${LOG_LLM_PROMPTS:-false}

      LOG_LLM_RESPONSES: ${LOG_LLM_RESPONSES:-false}

      ENABLE_USAGE_TRACKING: ${ENABLE_USAGE_TRACKING:-true}

      ENABLE_COST_TRACKING: ${ENABLE_COST_TRACKING:-true}

      ENABLE_MODEL_LATENCY_TRACKING: ${ENABLE_MODEL_LATENCY_TRACKING:-true}

      # =======================================================================
      # CORS
      # =======================================================================

      CORS_ALLOWED_ORIGINS: >-
        ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

    ports:
      - "${PORT:-8000}:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - buildwise-network

  postgres:
    image: postgres:17-alpine

    container_name: buildwise-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildwise}
      POSTGRES_USER: ${POSTGRES_USER:-buildwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildwise}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - buildwise_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-buildwise} -d ${POSTGRES_DB:-buildwise}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - buildwise-network

volumes:
  buildwise_postgres_data:
    name: buildwise-postgres-data

networks:
  buildwise-network:
    name: buildwise-network
    driver: bridge
